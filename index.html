<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しまなみかぶぬしミーティング｜公認かぶぬし</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      width: min(88vw, 560px);
      height: min(82vh, 720px);
      perspective: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(.2,.7,.2,1);
    }

    .card.flipping {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      overflow: hidden;
    }

    .front {
      transform: rotateY(0deg);
    }

    .back {
      transform: rotateY(180deg);
    }

    .card-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hint {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      color: #999;
      font-size: 12px;
      letter-spacing: 0.08em;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .scene {
        width: 92vw;
        height: 78vh;
      }

      .face {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="scene">
    <div class="card" id="card">

      <!-- 1枚目 -->
      <div class="face front">
        <img
          class="card-image"
          src="front.jpg"
          alt="しまなみかぶぬしミーティング"
        >
      </div>

      <!-- 2枚目 -->
      <div class="face back">
        <img
          class="card-image"
          src="back.jpg"
          alt="公認かぶぬし"
        >
      </div>

    </div>
  </div>

  <div class="hint" id="hint">
    画面をタップしてください
  </div>

  <script>
    const card = document.getElementById("card");
    const hint = document.getElementById("hint");

    let step = 0;

    document.body.addEventListener("click", () => {

      if (step === 0) {
        // 2枚目へ
        card.classList.add("flipping");
        step = 1;
        hint.textContent = "もう一度タップしてください";

      } else if (step === 1) {
        // 3枚目へ
        showLogo();
        step = 2;
        hint.textContent = "";
      }

    });

function showLogo() {
  const scene = document.querySelector(".scene");

  scene.innerHTML = `
    <div style="
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    ">
      <a
        href="https://shimanami-cubnushi.amebaownd.com/"
        style="
          display: block;
          width: 100%;
          height: 100%;
        "
      >
        <img
          src="logo.jpg"
          alt="しまなみかぶぬしミーティング 公認かぶぬし"
          style="
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
          "
        >
      </a>
    </div>
  `;

  const logo = scene.querySelector("img");

  logo.animate(
    [
      { opacity: 0, transform: "scale(.94)" },
      { opacity: 1, transform: "scale(1)", offset: 0.5 },
      { opacity: 1, transform: "scale(1.04)", offset: 0.7 },
      { opacity: 1, transform: "scale(1)" }
    ],
    {
      duration: 1200,
      easing: "cubic-bezier(.2,.7,.2,1)",
      fill: "forwards"
    }
  );
}
  </script>

</body>
</html>
